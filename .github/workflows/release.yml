name: release

# 正式可分发产物**只**由这条流水线出（DR-R5）。
# ci.yml 里的 bundle job 是「未签名打包冒烟」，验的是能不能打出来；
# 这里验的是能不能发出去：签名 + 公证 + SHA256SUMS + Release。
#
# 触发：打 tag（v*）或手动 dispatch。
# 裁定与 Secrets / Variables 清单见：
#   docs/superpowers/specs/2026-11-10-release-signing-distribution-design.md（§7 是唯一权威表）
# Release 正文模板：.github/release-notes-template.md
#
# 前置：先在本地跑 `mise run signing:wizard` 把凭据写进 GitHub Secrets / Variables，
#      再 `mise run release:check -- --tag v0.1.0`。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）。留空则生成一个 rc tag"
        required: false
        default: ""
      allow_draft_legal:
        description: "允许 docs/legal 仍有【待填】占位符（仅内测；正式发布必须过法务）"
        type: boolean
        default: false
      publish:
        description: "构建完成后把 Release 从 draft 转为正式发布"
        type: boolean
        default: false

# 同一个 tag 不并发出两份产物；不 cancel-in-progress，避免签名到一半被掐掉
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 建 Release、传 asset

env:
  PROJECT_PATH: apps/desktop

jobs:
  # ── 门禁：版本号一致、密钥不落仓、合规用语、法务占位符 ──────────────────
  preflight:
    name: 发布前门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # release-check.sh --history 需要全历史

      - name: 脚本语法自检
        run: |
          set -euo pipefail
          for s in scripts/version.sh scripts/release-check.sh scripts/verify-bundle.sh scripts/setup-signing.sh; do
            [[ -f "$s" ]] || { echo "::error::缺少 $s"; exit 1; }
            bash -n "$s"
          done
          echo "脚本语法 OK"

      - name: Release 正文模板存在
        run: test -f .github/release-notes-template.md

      - name: 版本号一致性
        run: scripts/version.sh check

      - name: 完整发布门禁（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-check.sh --history --tag "${GITHUB_REF#refs/tags/}"

      - name: 完整发布门禁（手动 dispatch）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          ARGS=(--history)
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            ARGS+=(--tag "${{ github.event.inputs.tag }}")
          fi
          if [[ "${{ github.event.inputs.allow_draft_legal }}" == "true" ]]; then
            ARGS+=(--allow-draft-legal)
          fi
          scripts/release-check.sh "${ARGS[@]}"

  # ── 建 draft Release，让三个平台 job 往同一个 release_id 传，避免竞态 ────
  create-release:
    name: 创建 draft Release
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: |
          set -euo pipefail
          VERSION="$(scripts/version.sh get)"
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}-rc.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布：$TAG（version=$VERSION）"

      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # 重跑同一个 tag 时复用已有 Release，不重复创建
          if EXISTING="$(gh release view "$TAG" --json id -q .id 2>/dev/null)"; then
            echo "复用已存在的 Release $TAG（id=$EXISTING）"
            echo "release_id=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{TAG}}/$TAG/g" \
            .github/release-notes-template.md > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" \
            --draft \
            --title "稿得快 GEO 客户端 ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "${GITHUB_SHA}"

          ID="$(gh release view "$TAG" --json id -q .id)"
          [[ -n "$ID" && "$ID" != "null" ]] || { echo "::error::拿不到 release id"; exit 1; }
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "已创建 draft Release $TAG（id=$ID）"

  # ── 构建矩阵：macOS arm64 / macOS x86_64 / Windows x64 ─────────────────
  build:
    name: 构建并签名（${{ matrix.label }}）
    needs: [preflight, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: dmg
            suffix: aarch64
          - label: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
            suffix: x64
          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            suffix: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # 仓库根 rust-toolchain.toml 钉了 1.98.1，会覆盖 dtolnay 装 targets 的工具链，
      # 交叉 target（macOS Intel / Windows）因此缺失（run 43378551722 实测）。显式补一次。
      - name: 补齐交叉编译 target
        run: rustup target add ${{ matrix.rust_target }}

      - name: 安装前端依赖
        run: pnpm --dir apps/desktop/ui install --frozen-lockfile

      # ── macOS：导入 Developer ID 证书到临时钥匙串 ────────────────────────
      - name: 导入 Apple Developer ID 证书
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_CERTIFICATE" ]] || { echo "::error::缺少 secret APPLE_CERTIFICATE，先跑 mise run signing:wizard"; exit 1; }
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          # ⚠ 站外分发必须是 Developer ID Application。
          # Tauri 官方示例里 grep "Apple Development" 对我们是错的（那是开发证书）：
          # 用错会「签名能过但公证失败 / Gatekeeper 仍拦」——见发布规格 DR-R5。
          security find-identity -v -p codesigning build.keychain | tee "$RUNNER_TEMP/identities.txt"
          grep -q "Developer ID Application" "$RUNNER_TEMP/identities.txt" \
            || { echo "::error::钥匙串里没有 Developer ID Application 证书"; exit 1; }
          rm -f "$RUNNER_TEMP/certificate.p12"

      # ── macOS：把 App Store Connect API Key 落成临时文件（DR-R4）──────────
      # APPLE_API_KEY_PATH 要的是**路径**不是内容，所以必须先写文件再导出。
      - name: 准备公证凭据
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for v in APPLE_API_KEY_CONTENT APPLE_API_KEY APPLE_API_ISSUER; do
            [[ -n "${!v}" ]] || { echo "::error::缺少 secret $v（公证必需，见发布规格 §4.4）"; exit 1; }
          done
          KEYDIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEYDIR"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEYDIR/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$KEYDIR/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$KEYDIR/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      # ── Windows：直下载通道（NSIS）当前**不签名**（DR-R3 修订 2026-11-13）────
      # 中国大陆主体拿不到 Azure Artifact Signing 公共信任（组织限 US/CA/EU/UK，
      # 个人限 US/CA），原 Azure 签名 CLI 与六个凭据/变量链路整体作废。
      # 主通道改走 Store MSIX（见下方 msix job，微软重签、免费、无 SmartScreen 警告）；
      # 直下载 exe 短期带 SmartScreen 提示，下载页必须如实写明（规格 DR-R3 修订）。
      # OV 证书（商业 CA 云签名）作为直下载通道的后续补签方案，单独立项。


      - name: 构建 + 签名 + 公证 + 上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS 公证：App Store Connect API Key 路线（DR-R4）
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Windows：Store MSIX 主通道由 msix job 出包、微软重签（DR-R3 修订）；
          # 直下载 NSIS 当前不签名，后续补商业 CA OV 云签名。
          # 自动更新（0.2 才启用，DR-R8）。Secret 未设时为空 = 不产出 .sig / latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
          # DR-R8：0.2 开启自动更新时把下面这行改成 true，
          # 并同时在 tauri.conf.json 打开 bundle.createUpdaterArtifacts（两件事必须同一个提交做）。
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          # 同时留一份 workflow artifact，供 checksums job 算 SHA256SUMS
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: bundle-${{ matrix.suffix }}-${{ matrix.os }}
          retryAttempts: 2

  # ── Windows Store MSIX 包（主通道，DR-R3 修订 2026-11-13）──────────────────
  # 中国大陆主体无 Azure Artifact Signing 公共信任资格；Store 通道的 MSIX 在认证
  # 通过后由微软用自家证书重签：免费、无 SmartScreen 警告、Smart App Control 可装。
  # ⚠ 产物**只**进 workflow artifact（store-msix-*），**不**进 Release asset：
  #    未自签的 MSIX 在 Store 之外装不了，放出去只会误导客户。
  # 上传 Store 目前手工（Partner Center → 程序包）；0.2 再评估 Store Developer CLI 自动化。
  msix:
    name: Windows Store MSIX 包
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 2026-11-13 裁定 B8：Store 版不含浏览器自动化通道（前端入口隐藏）
      VITE_STORE_BUILD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装前端依赖
        run: pnpm --dir apps/desktop/ui install --frozen-lockfile

      - name: 构建裸应用目录（不产 bundle）
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          ./ui/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --no-bundle -- --features store

      - name: 渲染包清单 + 备料
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(scripts/version.sh get)"
          scripts/msix-manifest.sh "$VERSION" msix-stage
          mkdir -p msix-stage/assets msix-out
          cp apps/desktop/src-tauri/icons/Square44x44Logo.png \
             apps/desktop/src-tauri/icons/Square150x150Logo.png \
             apps/desktop/src-tauri/icons/StoreLogo.png msix-stage/assets/
          echo "MSIX_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: makeappx 打包（不签名，Store 会重签）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ⚠ 显式 --target 时 cargo 产物在三段目录 target/<triple>/release/，不是 target/release/
          $bin = "target/x86_64-pc-windows-msvc/release"
          # ⚠ --no-bundle 的裸二进制用 cargo 包名（geo-desktop.exe）；productName 改名只发生在
          #    bundle 阶段。清单 Executable=gdk-geo.exe，所以这里复制时改名。
          if (-not (Test-Path "$bin/geo-desktop.exe")) { throw "找不到 $bin/geo-desktop.exe（构建产物路径漂移？）" }
          Copy-Item "$bin/geo-desktop.exe" "msix-stage/gdk-geo.exe"
          Get-ChildItem "$bin/*.dll" | Copy-Item -Destination "msix-stage/"
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw "找不到 makeappx.exe（Windows SDK）" }
          & $makeappx.FullName pack /d msix-stage /p "msix-out/gdk-geo_${env:MSIX_VERSION}_x64.msix" /l

      - name: 上传 workflow artifact（仅 Store 提交用）
        uses: actions/upload-artifact@v4
        with:
          name: store-msix-x64
          path: msix-out/*.msix
          if-no-files-found: error

  # ── SHA256SUMS + 发布 ───────────────────────────────────────────────────
  checksums:
    name: 生成 SHA256SUMS 并发布 Release
    needs: [preflight, create-release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: false

      - name: 计算 SHA-256
        run: |
          set -euo pipefail
          # 只收可分发的安装包；不收 .app 目录（目录无法整体校验）与中间产物
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sig' \) \
            | sort > /tmp/files.txt
          COUNT="$(wc -l < /tmp/files.txt | tr -d ' ')"
          if [[ "$COUNT" == "0" ]]; then echo "::error::没有找到任何安装包产物"; exit 1; fi
          echo "共 $COUNT 个产物"
          # 校验清单里只写文件名、不写 artifacts/… 路径，客户才能直接 `shasum -c`
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          : > "$STAGE/SHA256SUMS.txt"
          while IFS= read -r f; do
            cp -f "$f" "$STAGE/"
            ( cd "$STAGE" && sha256sum "$(basename "$f")" >> SHA256SUMS.txt )
          done < /tmp/files.txt
          cat "$STAGE/SHA256SUMS.txt"

      - name: 上传 SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" "$RUNNER_TEMP/stage/SHA256SUMS.txt" --clobber
          echo "Release $TAG 现有资产："
          gh release view "$TAG" --json assets -q '.assets[].name' | sort | sed 's/^/  /'

      - name: 正式发布（draft → latest）
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          # 三平台产物齐全才发布；缺一个就留在 draft，不发半成品
          ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          MISSING=""
          for need in aarch64.dmg x64.dmg x64-setup.exe SHA256SUMS.txt; do
            printf '%s\n' "$ASSETS" | grep -q -- "$need" || MISSING="$MISSING $need"
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::缺少产物$MISSING，Release 保持 draft 状态"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "✓ 已发布 $TAG"
          gh release view "$TAG" --json url -q .url
