[tools]
node = "24.21.0"
pnpm = "12.4.2"
rust = "1.98.1"

[env]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
RUST_BACKTRACE = "1"
# 需要与其他 rustup 项目彻底隔离时打开：
# MISE_RUSTUP_HOME = "{{env.HOME}}/.local/share/mise-rustup"
# MISE_CARGO_HOME = "{{env.HOME}}/.local/share/mise-cargo"

[tasks.doctor]
description = "打印本机工具链版本"
run = """
node -v
pnpm -v
rustc --version
cargo --version
"""

[tasks.install]
description = "安装前端依赖"
run = "pnpm --dir apps/desktop/ui install --frozen-lockfile=false"

[tasks.dev]
description = "启动 Tauri 开发窗口（原生 macOS 窗口）"
# tauri CLI 只在「当前目录及其子目录」里找 tauri.conf.json。配置在
# apps/desktop/src-tauri/、前端在 apps/desktop/ui/，两者是兄弟目录，
# 所以必须以 apps/desktop 为工作目录；在 ui/ 里跑会直接 panic
# （"Couldn't recognize the current folder as a Tauri project"）。
dir = "apps/desktop"
run = "./ui/node_modules/.bin/tauri dev"

[tasks.web]
description = "只启动前端 Vite（浏览器调试用）"
run = "pnpm --dir apps/desktop/ui run dev"

# demo 模式的**构建产物**入口：`web` 跑的是 vite dev（未打包、带 HMR），
# 这一条先 `build` 再用 `vite preview` 起静态服务器，验的是产品负责人真正会拿到的那份产物
# （含 `src/demo/seed/**` 的中文语料是否被正确打进包、体积增量是否可接受）。
# ⚠ 与 `dev` 不同，这里**不需要** `dir = "apps/desktop"`：没有 tauri CLI 参与，
# 两个 `--dir apps/desktop/ui` 各自指向 pnpm 的工作目录即可。
[tasks."demo:preview"]
description = "构建前端产物并用 vite preview 起静态服务器（demo 的构建产物形态，端口 4173）"
run = "pnpm --dir apps/desktop/ui run build && pnpm --dir apps/desktop/ui exec vite preview --port 4173"

[tasks.test]
description = "Rust + 前端全量测试 + 发布工程脚本测试"
run = [
  "cargo test --workspace",
  "pnpm --dir apps/desktop/ui run test",
  "scripts/tests/msix-manifest.test.sh",
  "scripts/tests/release-dmg.test.sh",
]

[tasks.lint]
description = "格式与静态检查"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "pnpm --dir apps/desktop/ui run lint",
]

[tasks.build]
description = "构建前端产物与 Rust release 检查"
run = [
  "pnpm --dir apps/desktop/ui run build",
  "cargo check --workspace --all-targets",
]

# ── 发布工程 ─────────────────────────────────────────────────────────────
# 裁定与完整步骤见 docs/superpowers/specs/2026-11-10-release-signing-distribution-design.md
# ⚠ 这些任务都只在宿主机跑（要访问钥匙串 / gh / codesign），不进 docker 一致性镜像。

[tasks."version:get"]
description = "打印当前版本（真值源：apps/desktop/src-tauri/tauri.conf.json）"
run = "scripts/version.sh get"

[tasks."version:check"]
description = "校验三处版本号一致（tauri.conf.json / Cargo.toml / ui/package.json）"
run = "scripts/version.sh check"

[tasks."version:set"]
description = "同步写入新版本号并刷新 Cargo.lock；用法：mise run version:set -- 0.1.1"
run = "scripts/version.sh set"

[tasks."release:check"]
description = "发布前门禁：文件齐备 / 版本一致 / 密钥不落仓 / 合规用语 / 法务占位符"
run = "scripts/release-check.sh"

[tasks."release:dmg"]
description = "本地一键出包：签名 DMG + 公证 + staple（需 ~/.config/gdk-geo/signing.env；-- 后可传 --dry-run）"
run = "scripts/release-dmg.sh"

[tasks."release:verify"]
description = "核验已构建产物的签名身份 / 公证 / staple 票据 / SHA-256"
run = "scripts/verify-bundle.sh"

[tasks."signing:wizard"]
description = "交互式配置发布签名凭据（Apple Developer ID / 公证 / Azure Artifact Signing）"
# ENV_FILE 必须指向仓库外：证书 base64 与 .p8 私钥内容都落在这个文件里（DR-R9）
run = 'env ENV_FILE="$HOME/.config/gdk-geo/signing.env" scripts/setup-signing.sh'

[tasks.check]
description = "提交前门禁：fmt + clippy + cargo test + vitest + build"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "pnpm --dir apps/desktop/ui run lint",
  "pnpm --dir apps/desktop/ui run test",
  "pnpm --dir apps/desktop/ui run build",
]
