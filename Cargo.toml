[workspace]
resolver = "2"
members = [
  "crates/geo-domain",
  "crates/geo-llm",
  "crates/geo-crawler",
  "crates/geo-store",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
authors = ["稿得快 <dev@gaodekuai.local>"]

[workspace.dependencies]
geo-domain = { path = "crates/geo-domain" }
geo-llm = { path = "crates/geo-llm" }
geo-crawler = { path = "crates/geo-crawler" }
geo-store = { path = "crates/geo-store" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
csv = "1.3"
encoding_rs = "0.8"
futures = "0.3"
html2text = "0.17"
keyring = { version = "4.2", features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "webpki-roots", "gzip", "charset", "system-proxy"] }
# rustls 走 ring provider：避免 aws-lc-sys 依赖 cmake，宿主机保持零 brew 依赖
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
wiremock = "0.6"

tauri = { version = "2.11", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
