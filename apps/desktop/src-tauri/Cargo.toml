[package]
name = "geo-desktop"
description = "稿得快 GEO 客户端（Tauri 2 桌面壳）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "geo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Store（MSIX）构建：不含浏览器自动化通道（2026-11-13 裁定 B8）
store = []

[dependencies]
geo-crawler = { workspace = true }
geo-domain = { workspace = true }
geo-llm = { workspace = true }
geo-store = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
headless_chrome = "1.0.22"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
rust_xlsxwriter = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Tauri mock runtime：`tests/ipc_llm_models_list.rs` 要调真实命令，钉住 IPC 参数键名。
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = { workspace = true }
